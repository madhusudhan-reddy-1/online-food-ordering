<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Register | FoodieBite</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a th:href="@{/}" href="/" class="logo" style="justify-content:center; margin-bottom:12px;">
          <div class="logo-icon"><i class="fa-solid fa-utensils"></i></div>
          <span>Foodie<strong>Bite</strong></span>
        </a>
        <h2 style="font-size:1.5rem; font-weight:800; color:var(--secondary);" id="auth-heading">Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.85rem;" id="auth-subheading">Sign in to your account to order faster and track food.</p>
      </div>

      <!-- Quick Demo Access Box -->
      <div class="demo-login-box">
        <div class="demo-login-title"><i class="fa-solid fa-wand-magic-sparkles"></i> 1-Click Demo Accounts for Testing</div>
        <div class="demo-buttons-row">
          <button type="button" class="demo-btn" id="btn-demo-customer">
            <i class="fa-solid fa-user"></i> Demo Customer
          </button>
          <button type="button" class="demo-btn" id="btn-demo-admin" style="color:var(--primary); border-color:var(--primary);">
            <i class="fa-solid fa-shield-halved"></i> Demo Admin
          </button>
        </div>
      </div>

      <!-- Auth Switch Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login-btn">Sign In</button>
        <button class="auth-tab-btn" id="tab-register-btn">Create Account</button>
      </div>

      <!-- Error Message Banner -->
      <div id="auth-error-banner" style="display:none; background:#fee2e2; border:1px solid #fca5a5; color:#991b1b; padding:10px 14px; border-radius:var(--radius-sm); font-size:0.85rem; margin-bottom:16px;"></div>

      <!-- ==========================================
           LOGIN FORM
           ========================================== -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="customer@foodie.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position:relative;">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('login-password', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text-muted);">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-size:0.85rem;">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" style="color:var(--primary); font-weight:600;" onclick="alert('For demo testing, use the 1-click demo buttons above!')">Forgot Password?</a>
        </div>

        <button type="submit" id="btn-submit-login" class="btn-checkout" style="width:100%;">
          <span>Sign In to FoodieBite</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- ==========================================
           REGISTRATION FORM
           ========================================== -->
      <form id="register-form" style="display:none;">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Sarah Connor" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="sarah@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 234-5678" required>
        </div>

        <div class="form-group">
          <label class="form-label">Default Delivery Address</label>
          <input type="text" id="reg-address" class="form-control" placeholder="124 Conch Street, City">
        </div>

        <div class="form-group">
          <label class="form-label">Create Password *</label>
          <div style="position:relative;">
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
            <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('reg-password', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text-muted);">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit-reg" class="btn-checkout" style="width:100%; margin-top:20px;">
          <span>Create Account</span>
          <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.85rem; color:var(--text-muted);">
        <a th:href="@{/}" href="/" style="display:inline-flex; align-items:center; gap:6px; font-weight:600; color:var(--secondary);">
          <i class="fa-solid fa-arrow-left"></i> Back to Storefront
        </a>
      </div>
    </div>
  </div>

  <script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
  <script>
    const tabLogin = document.getElementById('tab-login-btn');
    const tabReg = document.getElementById('tab-register-btn');
    const formLogin = document.getElementById('login-form');
    const formReg = document.getElementById('register-form');
    const heading = document.getElementById('auth-heading');
    const subheading = document.getElementById('auth-subheading');
    const errorBanner = document.getElementById('auth-error-banner');

    function showError(msg) {
      if (errorBanner) {
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
      }
    }

    function clearError() {
      if (errorBanner) errorBanner.style.display = 'none';
    }

    tabLogin.addEventListener('click', () => {
      clearError();
      tabLogin.classList.add('active');
      tabReg.classList.remove('active');
      formLogin.style.display = 'block';
      formReg.style.display = 'none';
      heading.textContent = 'Welcome Back';
      subheading.textContent = 'Sign in to your account to order faster and track food.';
    });

    tabReg.addEventListener('click', () => {
      clearError();
      tabReg.classList.add('active');
      tabLogin.classList.remove('active');
      formReg.style.display = 'block';
      formLogin.style.display = 'none';
      heading.textContent = 'Create New Account';
      subheading.textContent = 'Join FoodieBite for exclusive coupons and speedy ordering.';
    });

    // 1-Click Demo buttons
    document.getElementById('btn-demo-customer').addEventListener('click', () => {
      clearError();
      document.getElementById('login-email').value = 'customer@foodie.com';
      document.getElementById('login-password').value = 'user123';
      formLogin.dispatchEvent(new Event('submit'));
    });

    document.getElementById('btn-demo-admin').addEventListener('click', () => {
      clearError();
      document.getElementById('login-email').value = 'admin@foodie.com';
      document.getElementById('login-password').value = 'admin123';
      formLogin.dispatchEvent(new Event('submit'));
    });

    // Handle Login Form
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const btn = document.getElementById('btn-submit-login');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      const res = await Auth.login(email, password);
      btn.disabled = false;
      btn.innerHTML = '<span>Sign In to FoodieBite</span> <i class="fa-solid fa-arrow-right"></i>';

      if (res.success) {
        if (res.user.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/';
        }
      } else {
        showError(res.message);
      }
    });

    // Handle Register Form
    formReg.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const address = document.getElementById('reg-address').value.trim();
      const password = document.getElementById('reg-password').value;

      const btn = document.getElementById('btn-submit-reg');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

      const res = await Auth.register(name, email, password, phone, address);
      btn.disabled = false;
      btn.innerHTML = '<span>Create Account</span> <i class="fa-solid fa-user-plus"></i>';

      if (res.success) {
        window.location.href = '/';
      } else {
        showError(res.message);
      }
    });

    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fa-regular fa-eye"></i>';
      }
    }
  </script>
</body>
</html>
